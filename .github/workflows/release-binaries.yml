name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    # Real bug, not a capacity fluke: the matrix used to target "macos-13",
    # which actionlint's real current runner-label list confirms no longer
    # exists in GitHub's hosted fleet at all -- a job requesting it can never
    # be picked up, so it sits queued until GitHub's 24h hard workflow-run
    # cap force-cancels the whole run. Observed directly across 3 consecutive
    # real runs before being diagnosed. Fixed by targeting "macos-15-intel"
    # (still a real Intel Mac runner) below. timeout-minutes still added as
    # defense in depth -- it counts queued time, not just execution time, so
    # any future case of a runner label going stale again fails within an
    # hour instead of eating 24h; every platform's real build time observed
    # is under 3 minutes, so 60 minutes is generous headroom either way.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: depshieldx-windows-x64.exe
            built-name: depshieldx.exe
          - os: macos-15-intel
            artifact: depshieldx-macos-x64
            built-name: depshieldx
          - os: macos-latest
            artifact: depshieldx-macos-arm64
            built-name: depshieldx
          - os: ubuntu-latest
            artifact: depshieldx-linux-x64
            built-name: depshieldx
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.4"

      - name: Install package with packaging dependencies
        run: python -m pip install -e ".[packaging]"

      - name: Build binary
        run: pyinstaller packaging/depshieldx.spec

      - name: Rename built binary to matrix artifact name
        shell: bash
        run: mv "dist/${{ matrix.built-name }}" "dist/${{ matrix.artifact }}"

      - name: Smoke test the built binary
        shell: bash
        run: python packaging/smoke_test.py "dist/${{ matrix.artifact }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Attach binaries to GitHub Release
    needs: build
    # always() so one flaky platform (see the build job's timeout-minutes
    # comment) can never block the other platforms' binaries from being
    # attached -- `needs:` alone would skip this job entirely if even one
    # matrix entry failed or was cancelled, which is exactly what happened
    # to v0.2.0's release: 3 of 4 platforms built fine, but the whole
    # release was silently skipped because macos-x64 didn't. Re-checks the
    # original trigger condition explicitly since always() bypasses the
    # default "needs succeeded" gate entirely, not just failure states.
    if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Fail clearly if every platform failed
        run: |
          if [ -z "$(ls -A dist/ 2>/dev/null)" ]; then
            echo "::error::No platform build succeeded -- nothing to release." >&2
            exit 1
          fi
          ls -la dist/

      - name: Create or update the GitHub Release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --notes "Standalone binaries for this release. \`pip install depshieldx\` still works and gets the same version. If a platform's binary is missing here, that platform's build didn't complete this run -- re-run the Release Binaries workflow to retry it." \
            || gh release upload "${{ github.ref_name }}" dist/* --clobber
