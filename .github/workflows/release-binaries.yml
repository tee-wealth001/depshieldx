name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: depshieldx-windows-x64.exe
            built-name: depshieldx.exe
          - os: macos-13
            artifact: depshieldx-macos-x64
            built-name: depshieldx
          - os: macos-latest
            artifact: depshieldx-macos-arm64
            built-name: depshieldx
          - os: ubuntu-latest
            artifact: depshieldx-linux-x64
            built-name: depshieldx
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.4"

      - name: Install package with packaging dependencies
        run: python -m pip install -e ".[packaging]"

      - name: Build binary
        run: pyinstaller packaging/depshieldx.spec

      - name: Rename built binary to matrix artifact name
        shell: bash
        run: mv "dist/${{ matrix.built-name }}" "dist/${{ matrix.artifact }}"

      - name: Smoke test the built binary
        shell: bash
        run: python packaging/smoke_test.py "dist/${{ matrix.artifact }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Attach binaries to GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create or update the GitHub Release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --notes "Standalone binaries for this release. \`pip install depshieldx\` still works and gets the same version." \
            || gh release upload "${{ github.ref_name }}" dist/* --clobber
