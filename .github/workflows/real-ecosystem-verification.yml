name: Real Ecosystem Verification

# Runs a real depshieldx fast-mode + deep-mode (Docker + Trivy) install
# against one small, real, pinned package per ecosystem -- unlike tests.yml,
# which covers unit/integration behavior with mocks and fixtures, this
# exercises the real toolchains (cargo/go/mvn/dotnet/dart/bundle/composer),
# real Docker sandbox images, and a real Trivy scan end to end, the same
# manual verification pass this project's own history has otherwise relied
# on a human repeating by hand before every release.
#
# Triggered on a version tag (alongside Release Binaries/Release Checks)
# and manually via workflow_dispatch -- deliberately NOT on every PR/push,
# since a full Docker-sandbox-image build plus a real Trivy scan per
# ecosystem is meaningfully slower and more failure-prone (real upstream
# registries, real Docker Hub pulls) than tests.yml's mocked coverage, the
# same "don't slow down every PR for release-time validation" reasoning
# release-binaries.yml's own trigger already follows.
#
# ubuntu-latest is used throughout: it has Docker pre-installed (required
# for deep mode) and, per GitHub's own runner-images documentation, ships
# Go, a JDK + Maven, the .NET SDK, and PHP + Composer preinstalled already.
# Rust/Cargo, the Dart SDK, and Ruby + Bundler all need an explicit setup
# step below -- confirmed directly Ruby needed one too (a real run failed
# with "'bundle' was not found on PATH" against plain ubuntu-latest,
# contradicting this comment's own prior assumption that it shipped
# preinstalled the way it does on some other CI providers' images).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  verify:
    name: Verify (${{ matrix.ecosystem }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # target syntax: confirmed directly against real failed runs that
        # this is not one uniform convention. pypi uses "name==version"
        # (a real "Invalid URL '1.16.0'" pip error confirmed this,
        # matching storage/receipts.py's own _install_target_label).
        # Maven uses its own native "groupId:artifactId:version" coordinate
        # notation, not "@" (a real "could not determine the latest
        # version... pass an explicit groupId:artifactId:version" error
        # from ecosystems/maven/ecosystem.py confirmed this). Every other
        # ecosystem here uses "name@version".
        include:
          - ecosystem: pypi
            target: "six==1.16.0"
          - ecosystem: npm
            target: "left-pad@1.3.0"
          - ecosystem: cargo
            target: "itoa@1.0.11"
          - ecosystem: go
            target: "github.com/google/uuid@v1.6.0"
          - ecosystem: maven
            # 3.14.0 has a real, current CVE (CVE-2025-48924) --
            # confirmed directly this made a real run correctly BLOCKED
            # at the fast-mode provenance/vulnerability check (working
            # as intended, not a depshieldx bug); 3.18.0 confirmed
            # directly clean of reported vulnerabilities.
            target: "org.apache.commons:commons-lang3:3.18.0"
          - ecosystem: nuget
            target: "Newtonsoft.Json@13.0.3"
          - ecosystem: pub
            target: "path@1.9.0"
          - ecosystem: rubygems
            target: "json@2.21.2"
          - ecosystem: composer
            target: "psr/log@3.0.2"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.4"

      - name: Set up Rust (cargo)
        if: matrix.ecosystem == 'cargo'
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Dart SDK (pub)
        if: matrix.ecosystem == 'pub'
        uses: dart-lang/setup-dart@v1

      - name: Set up Ruby + Bundler (rubygems)
        # Confirmed directly against a real failed run: ubuntu-latest
        # does NOT ship bundle/Ruby on PATH the way it does Go/a JDK+
        # Maven/the .NET SDK/PHP+Composer -- this module docstring's
        # earlier assumption to the contrary was wrong.
        if: matrix.ecosystem == 'rubygems'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Install depshieldx from source
        run: python -m pip install -e .

      - name: Report toolchain/Docker/Trivy availability
        run: depshieldx doctor
        continue-on-error: true

      - name: Real fast-mode scan
        run: |
          depshieldx scan "${{ matrix.target }}" --ecosystem "${{ matrix.ecosystem }}" --fast --output json --full-report > fast-report.json
          cat fast-report.json

      - name: Assert fast-mode resolved cleanly
        run: |
          python -c "
          import json
          report = json.load(open('fast-report.json'))
          resolution = report.get('resolution') or {}
          assert resolution.get('resolution_succeeded'), f\"resolution failed: {resolution.get('resolution_error')}\"
          print('fast-mode resolution OK')
          "

      - name: Real deep-mode scan (Docker sandbox + Trivy)
        run: |
          depshieldx scan "${{ matrix.target }}" --ecosystem "${{ matrix.ecosystem }}" --deep --no-cache --output json --full-report > deep-report.json
          cat deep-report.json

      - name: Assert deep-mode sandbox and Trivy both ran cleanly
        run: |
          python -c "
          import json
          report = json.load(open('deep-report.json'))
          sandbox = report.get('sandbox') or {}
          assert sandbox.get('success') is True, f\"sandbox did not succeed: {sandbox.get('error')}\"
          trivy = sandbox.get('trivy_results') or {}
          assert trivy.get('scanned') is True, f\"trivy did not run: {trivy}\"
          assert trivy.get('should_block') is False, f\"trivy flagged a real blocking finding: {trivy}\"
          print('deep-mode sandbox + Trivy OK')
          "

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-ecosystem-verification-${{ matrix.ecosystem }}
          path: |
            fast-report.json
            deep-report.json
          if-no-files-found: ignore
