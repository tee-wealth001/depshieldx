[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "depshieldx"
version = "0.8.2"
description = "Safer package install and scan tool for PyPI, npm/yarn/pnpm, Cargo/crates.io, Go modules, Maven/Maven Central, NuGet/NuGet.org, Pub/pub.dev, and RubyGems/rubygems.org, with cryptographic provenance checks (PyPI/npm/Maven/NuGet/Pub/RubyGems), CVE lookups, Docker + Trivy deep mode with behavioral tracing, and signed receipts"
authors = [
    { name="Stephen Toriola", email="stephenola21@gmail.com" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11.4"
keywords = ["security", "pypi", "pip", "npm", "cargo", "crates.io", "rust", "go", "golang", "maven", "java", "nuget", "dotnet", "csharp", "pub", "dart", "flutter", "rubygems", "ruby", "bundler", "supply-chain", "provenance", "sigstore", "trivy", "receipts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
    "Topic :: Utilities",
]
dependencies = [
    "click",
    "requests>=2.32.4",
    "aiohttp>=3.12.14",
    "packaging",
    "pypi-attestations>=0.0.28",
    "sigstore>=3.0",
    "PyYAML>=6.0",
    "node-semver>=0.9.0",
    "semver>=3.0",
    "defusedxml>=0.7.1"
]

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "twine>=6.1.0",
    "pytest>=8.3",
    "jsonschema>=4.23",
]
packaging = [
    "pyinstaller>=6.0",
]

[project.urls]
Homepage = "https://github.com/tee-wealth001/depshieldx"
Documentation = "https://tee-wealth001.github.io/depshieldx/"
Repository = "https://github.com/tee-wealth001/depshieldx"
Issues = "https://github.com/tee-wealth001/depshieldx/issues"

[project.scripts]
depshieldx = "depshieldx.cli:cli"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["depshieldx*"]

[tool.setuptools.package-data]
depshieldx = ["presentation/web/templates/*.html", "security/sandbox/sandbox_wrapper_npm.js", "security/sandbox/docker/*.Dockerfile"]

[tool.pytest.ini_options]
markers = [
    "live: hits a real external network service (npm registry, OSV, GitHub Advisories, deps.dev, PyPI) whose availability/rate limits are outside our control. Not excluded by default -- run `pytest -m \"not live\"` for a fully offline/deterministic run.",
]
